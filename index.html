<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<title>ع السريع | SahraGames</title>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --violet:#8B5CF6; --violet-light:#C084FC; --pink:#EC4899; --gold:#FBBF24;
    --green:#22C55E; --red:#EF4444; --text:#F4F4F5; --muted:#A1A1AA;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    width:100vw; height:100vh; height:100dvh;
    overflow:hidden; position:fixed; inset:0;
    font-family:'Cairo',sans-serif; color:var(--text);
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(236,72,153,0.18), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(139,92,246,0.20), transparent 60%),
      linear-gradient(180deg, #0c0616 0%, #09090B 50%, #0c0616 100%);
    -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
  }
  .screen {
    position:absolute; inset:0; width:100%; height:100%;
    display:none; flex-direction:column; overflow:hidden;
    padding: calc(var(--safe-top) + 10px) 16px calc(var(--safe-bottom) + 10px);
  }
  .screen.active { display:flex; }
  .title-gradient {
    background:linear-gradient(90deg,#FB7185 0%,#EC4899 35%,#C084FC 70%,#8B5CF6 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 0 12px rgba(236,72,153,0.45));
    line-height:1.4; padding:2px 0;
  }
  .card {
    background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 8px 32px rgba(0,0,0,0.35);
  }
  .btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:900; color:#fff;
    transition:transform .12s ease, box-shadow .12s ease, opacity .15s ease;
    flex-shrink:0;
  }
  .btn:active { transform:scale(0.97); }
  .btn-primary {
    background:linear-gradient(90deg,#F43F5E 0%,#EC4899 55%,#8B5CF6 100%);
    box-shadow:0 0 22px rgba(236,72,153,0.45), 0 0 40px rgba(139,92,246,0.25);
  }
  .btn-ghost { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); }
  .btn:disabled { opacity:0.45; box-shadow:none; cursor:not-allowed; }
  .inp {
    width:100%; padding:13px 16px; background:rgba(255,255,255,0.04);
    border:1.5px solid rgba(255,255,255,0.10); border-radius:14px;
    color:#fff; font-family:inherit; font-size:15px; font-weight:700;
    outline:none; text-align:center; transition:all .15s ease;
  }
  .inp::placeholder { color:#52525B; font-weight:400; }
  .inp:focus {
    border-color:rgba(196,132,252,0.6);
    box-shadow:0 0 0 3px rgba(139,92,246,0.15), 0 0 16px rgba(139,92,246,0.25);
  }
  .inp-code { font-size:20px; letter-spacing:8px; font-weight:900; padding-right:8px; }

  #screen-home { justify-content:center; align-items:center; }
  .home-wrap { width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; }
  .brand { display:flex; align-items:center; justify-content:center; gap:12px; padding:6px 0 2px; }
  .brand-logo {
    width:52px; height:52px; min-width:52px; border-radius:16px;
    background:linear-gradient(135deg,#F43F5E 0%,#EC4899 45%,#8B5CF6 100%);
    display:flex; align-items:center; justify-content:center; font-size:26px; line-height:1;
    box-shadow:0 0 24px rgba(236,72,153,0.6), 0 0 46px rgba(139,92,246,0.35);
  }
  .brand-text { display:flex; flex-direction:column; justify-content:center; gap:3px; padding:2px 0; }
  .brand-title { font-size:26px; font-weight:900; line-height:1.35; padding:3px 0; }
  .brand-sub { font-size:10px; font-weight:800; letter-spacing:4px; color:var(--muted); line-height:1.2; text-align:right; }
  .tagline { text-align:center; font-size:12px; color:var(--muted); font-weight:700; padding:0 8px; line-height:1.5; }
  .input-card { border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .section-title { font-size:11px; font-weight:800; color:var(--muted); letter-spacing:1.5px; text-align:right; }
  .divider {
    display:flex; align-items:center; gap:12px; color:var(--muted); font-size:11px; font-weight:700; padding:2px 0;
  }
  .divider::before, .divider::after {
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, rgba(196,132,252,0.35), transparent);
  }

  /* ============ LOBBY ============ */
  .lobby-wrap {
    flex:1; display:flex; flex-direction:column; gap:12px;
    max-width:440px; width:100%; margin:0 auto; min-height:0; overflow:hidden;
  }
  .room-code-box {
    background:linear-gradient(160deg, rgba(139,92,246,0.18), rgba(236,72,153,0.08));
    border:1.5px solid rgba(196,132,252,0.4); border-radius:18px; padding:14px 16px;
    text-align:center; box-shadow:0 0 26px rgba(139,92,246,0.25); flex-shrink:0;
  }
  .room-code-label { font-size:10px; color:var(--violet-light); font-weight:800; letter-spacing:2px; line-height:1.4; }
  .room-code-value {
    font-size:40px; font-weight:900; letter-spacing:10px; padding:4px 0 4px 10px; line-height:1.15;
    background:linear-gradient(90deg,#FB7185,#EC4899,#C084FC,#8B5CF6);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px rgba(236,72,153,0.6));
  }
  .players-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; flex-shrink:0; }
  .player-slot {
    background:rgba(255,255,255,0.04); border:1.5px dashed rgba(255,255,255,0.10);
    border-radius:14px; padding:10px 8px; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    min-height:76px; transition:all .2s ease;
  }
  .player-slot.filled {
    border-style:solid; border-color:rgba(196,132,252,0.35);
    background:rgba(139,92,246,0.10); box-shadow:0 0 12px rgba(139,92,246,0.20);
  }
  .player-slot.is-host { border-color:var(--gold); box-shadow:0 0 14px rgba(251,191,36,0.4); }
  .player-slot .ps-avatar { font-size:26px; line-height:1; }
  .player-slot .ps-name {
    font-size:12px; font-weight:800; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; max-width:100%; line-height:1.3;
  }
  .player-slot .ps-badge {
    font-size:8px; font-weight:900;
    background:linear-gradient(90deg, var(--gold), #F59E0B); color:#1a0b2e;
    padding:2px 8px; border-radius:10px; line-height:1.3;
  }
  .player-slot .ps-empty { color:#52525B; font-size:11px; font-weight:700; line-height:1.4; }

  .cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; flex-shrink:0; }
  .cat-btn {
    background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,255,255,0.10);
    border-radius:16px; padding:14px 8px; cursor:pointer; transition:all .2s ease;
    color:#fff; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .cat-btn .cat-icon { font-size:30px; line-height:1; }
  .cat-btn .cat-name { font-size:13px; font-weight:900; line-height:1.3; }
  .cat-btn.selected {
    border-color:var(--pink);
    background:linear-gradient(135deg, rgba(244,63,94,0.20), rgba(139,92,246,0.20));
    box-shadow:0 0 0 2px rgba(236,72,153,0.35), 0 0 22px rgba(236,72,153,0.45);
    transform:translateY(-2px);
  }
  .cat-btn:disabled { opacity:0.4; cursor:not-allowed; }

  .guest-status-card {
    flex-shrink:0; border-radius:18px; padding:16px; text-align:center;
    background:linear-gradient(160deg, rgba(139,92,246,0.12), rgba(236,72,153,0.06));
    border:1.5px solid rgba(196,132,252,0.30);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .guest-status-label { font-size:11px; font-weight:800; color:var(--violet-light); letter-spacing:1.5px; }
  .guest-status-cat { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:900; }
  .guest-status-cat .cat-icon { font-size:26px; line-height:1; }
  .guest-status-msg { font-size:12px; color:var(--muted); font-weight:700; line-height:1.5; margin-top:4px; }
  .guest-status-msg .dot {
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--green); box-shadow:0 0 8px var(--green);
    animation:pulseDot 1.4s ease-in-out infinite; margin-left:6px; vertical-align:middle;
  }
  @keyframes pulseDot {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.8); }
  }

  /* ============ GAME — Fixed layout ============ */
  .game-wrap {
    flex:1; display:flex; flex-direction:column; gap:10px;
    max-width:520px; width:100%; margin:0 auto;
    min-height:0; overflow:hidden;
  }
  .game-top {
    display:flex; justify-content:space-between; align-items:center;
    flex-shrink:0; gap:8px;
  }
  .q-pill {
    background:rgba(139,92,246,0.15); border:1px solid rgba(196,132,252,0.35);
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:900;
    color:var(--violet-light); line-height:1.3;
  }
  .target-pill {
    background:linear-gradient(90deg, rgba(251,191,36,0.18), rgba(251,191,36,0.06));
    border:1px solid rgba(251,191,36,0.45);
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:900;
    color:var(--gold); line-height:1.3;
  }

  /* Question card — fixed height */
  .question-card {
    border-radius:18px;
    padding:18px 16px;
    text-align:center;
    font-size:17px;
    font-weight:800;
    line-height:1.55;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    min-height:110px;
    max-height:150px;
    overflow:hidden;
  }

  /* Choices — fill remaining space evenly */
  .choices-grid {
    display:grid;
    grid-template-columns:1fr;
    grid-template-rows:repeat(4, 1fr);
    gap:8px;
    flex:1;
    min-height:0;
  }
  .choice-btn {
    padding:12px 14px;
    background:rgba(255,255,255,0.04);
    border:1.5px solid rgba(255,255,255,0.12);
    border-radius:14px;
    color:#F4F4F5;
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    line-height:1.35;
    cursor:pointer;
    transition:all .2s ease;
    text-align:right;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:0;
    overflow:hidden;
    position:relative;
  }
  .choice-btn .choice-letter {
    width:30px; height:30px; border-radius:9px;
    background:rgba(139,92,246,0.20); border:1px solid rgba(196,132,252,0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:900; flex-shrink:0;
    color:var(--violet-light); line-height:1;
    transition:all .2s ease;
  }
  .choice-btn .choice-text {
    flex:1; overflow:hidden; text-overflow:ellipsis;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }

  /* Enabled + idle */
  .choice-btn:not(:disabled):not(.dimmed):not(.removed):not(.correct):not(.wrong):active {
    transform:scale(0.98);
    background:rgba(139,92,246,0.12);
  }

  /* ✅ الإجابة الصحيحة */
  .choice-btn.correct {
    border-color:var(--green);
    background:linear-gradient(135deg, rgba(34,197,94,0.30), rgba(34,197,94,0.10));
    box-shadow:0 0 0 2px rgba(34,197,94,0.5), 0 0 24px rgba(34,197,94,0.7);
    transform:scale(1.02);
  }
  .choice-btn.correct .choice-letter {
    background:linear-gradient(135deg, var(--green), #15803D);
    border-color:transparent;
    color:#fff;
    box-shadow:0 0 12px rgba(34,197,94,0.7);
  }

  /* ❌ إجابة اللاعب الخاطئة */
  .choice-btn.wrong {
    border-color:var(--red);
    background:linear-gradient(135deg, rgba(239,68,68,0.30), rgba(239,68,68,0.10));
    box-shadow:0 0 0 2px rgba(239,68,68,0.5), 0 0 20px rgba(239,68,68,0.55);
  }
  .choice-btn.wrong .choice-letter {
    background:linear-gradient(135deg, var(--red), #991B1B);
    border-color:transparent;
    color:#fff;
    box-shadow:0 0 12px rgba(239,68,68,0.7);
  }

  /* 🚫 خيار محذوف (لاعب آخر اختاره خطأً) */
  .choice-btn.removed {
    opacity:0.3;
    text-decoration:line-through;
    text-decoration-color:var(--red);
    text-decoration-thickness:2px;
    border-color:rgba(239,68,68,0.35);
    background:rgba(239,68,68,0.05);
    cursor:not-allowed;
    filter:grayscale(0.75);
  }
  .choice-btn.removed .choice-letter {
    background:rgba(239,68,68,0.2);
    border-color:rgba(239,68,68,0.4);
    color:#FCA5A5;
  }

  /* 🔒 خيار مُعطَّل عند اللاعب المجمّد (بدون تغيير في اللون) */
  .choice-btn.dimmed {
    opacity:0.5;
    pointer-events:none;
    cursor:not-allowed;
  }

  /* ============ Live scores ============ */
  .live-scores {
    display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
    flex-shrink:0; padding-bottom:2px; min-height:36px;
  }
  .live-scores::-webkit-scrollbar { display:none; }
  .score-chip {
    display:flex; align-items:center; gap:5px; padding:6px 11px;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10);
    border-radius:20px; font-size:11px; font-weight:800; flex-shrink:0;
    line-height:1.3; transition:all .25s ease;
  }
  .score-chip.me {
    border-color:var(--pink);
    background:linear-gradient(90deg, rgba(236,72,153,0.20), rgba(139,92,246,0.20));
    box-shadow:0 0 10px rgba(236,72,153,0.4);
  }
  .score-chip.locked {
    border-color:var(--red);
    background:linear-gradient(90deg, rgba(239,68,68,0.18), rgba(239,68,68,0.05));
    box-shadow:0 0 10px rgba(239,68,68,0.35);
  }
  .score-chip.winner {
    border-color:var(--green);
    background:linear-gradient(90deg, rgba(34,197,94,0.25), rgba(34,197,94,0.08));
    box-shadow:0 0 12px rgba(34,197,94,0.5);
    transform:scale(1.05);
  }
  .score-chip .sc-avatar { font-size:13px; line-height:1; }
  .score-chip .sc-score { color:var(--gold); font-weight:900; font-size:13px; }
  .score-chip .sc-state { font-size:11px; line-height:1; }

  /* ============ Results ============ */
  .results-wrap {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:12px;
    max-width:420px; width:100%; margin:0 auto; min-height:0; overflow:hidden; padding-top:8px;
  }
  .trophy {
    font-size:60px; line-height:1;
    filter:drop-shadow(0 0 26px rgba(251,191,36,0.7));
    animation:trophyBounce 1.6s infinite; flex-shrink:0;
  }
  @keyframes trophyBounce {
    0%,100% { transform:translateY(0) rotate(0deg); }
    50% { transform:translateY(-8px) rotate(3deg); }
  }
  .results-title { font-size:22px; font-weight:900; text-align:center; flex-shrink:0; }
  .winner-name {
    font-size:16px; font-weight:900; color:var(--gold);
    text-shadow:0 0 14px rgba(251,191,36,0.6);
    text-align:center; flex-shrink:0;
  }
  .results-list {
    width:100%; display:flex; flex-direction:column; gap:8px;
    overflow-y:auto; min-height:0; flex:1; padding:2px; scrollbar-width:none;
  }
  .results-list::-webkit-scrollbar { display:none; }
  .result-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:rgba(255,255,255,0.04);
    border:1.5px solid rgba(255,255,255,0.10);
    border-radius:14px; gap:10px; flex-shrink:0;
  }
  .result-row.rank-1 {
    background:linear-gradient(90deg, rgba(251,191,36,0.20), rgba(251,191,36,0.06));
    border-color:rgba(251,191,36,0.6); box-shadow:0 0 20px rgba(251,191,36,0.35);
  }
  .result-row.rank-2 {
    background:linear-gradient(90deg, rgba(209,213,219,0.15), rgba(209,213,219,0.04));
    border-color:rgba(209,213,219,0.4);
  }
  .result-row.rank-3 {
    background:linear-gradient(90deg, rgba(217,119,6,0.20), rgba(217,119,6,0.06));
    border-color:rgba(217,119,6,0.5);
  }
  .result-info { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .result-rank { font-size:20px; font-weight:900; min-width:28px; text-align:center; line-height:1; }
  .result-avatar { font-size:22px; line-height:1; }
  .result-name {
    font-size:14px; font-weight:800; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .result-score {
    font-size:18px; font-weight:900; color:var(--gold);
    text-shadow:0 0 10px rgba(251,191,36,0.5); flex-shrink:0;
  }

  /* ============ Utilities ============ */
  .hidden { display:none !important; }
  .flex-col { display:flex; flex-direction:column; }
  .gap-8 { gap:8px; }
  .spacer { flex:1; min-height:4px; }

  /* ============ Responsive tweaks ============ */
  @media (max-height:700px) {
    .brand-logo { width:46px; height:46px; font-size:22px; min-width:46px; }
    .brand-title { font-size:22px; }
    .tagline { font-size:11px; }
    .home-wrap { gap:12px; }
    .input-card { padding:14px; gap:8px; }
    .inp { padding:11px 14px; font-size:14px; }
    .btn { padding:12px !important; font-size:14px !important; }
    .room-code-value { font-size:34px; letter-spacing:8px; }
    .question-card { font-size:15px; min-height:90px; max-height:120px; padding:14px 12px; }
    .choice-btn { padding:10px 12px; font-size:13px; }
    .choice-btn .choice-letter { width:26px; height:26px; font-size:12px; }
    .trophy { font-size:50px; }
    .results-title { font-size:19px; }
  }
  @media (max-height:600px) {
    .brand-logo { width:38px; height:38px; font-size:18px; min-width:38px; }
    .brand-title { font-size:18px; }
    .tagline { display:none; }
    .question-card { font-size:14px; min-height:80px; max-height:100px; padding:12px 10px; }
    .choice-btn { font-size:12.5px; padding:9px 11px; }
    .choice-btn .choice-letter { width:24px; height:24px; font-size:11px; }
  }
  /* Wide desktop: choices in 2x2 */
  @media (min-width:600px) and (min-height:620px) {
    .choices-grid {
      grid-template-columns:1fr 1fr;
      grid-template-rows:repeat(2, 1fr);
    }
  }
</style>
</head>
<body>

<!-- ═══════════ HOME ═══════════ -->
<div id="screen-home" class="screen active">
  <div class="home-wrap">
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <div class="brand-text">
        <span class="brand-title title-gradient">ع السريع</span>
        <span class="brand-sub">SAHRA GAMES</span>
      </div>
    </div>
    <div class="tagline">لعبة أسئلة متعددة اللاعبين — من 2 إلى 4 لاعبين</div>

    <div class="input-card card">
      <div class="section-title">اسمك</div>
      <input id="inputName" class="inp" type="text" maxlength="15" placeholder="اكتب اسمك هنا" autocomplete="off">
    </div>

    <button id="btnCreateRoom" class="btn btn-primary" style="padding:14px; border-radius:14px; font-size:15px;">
      🏠 إنشاء غرفة جديدة
    </button>

    <div class="divider">أو</div>

    <div class="input-card card">
      <div class="section-title">الانضمام برمز</div>
      <input id="inputRoomCode" class="inp inp-code" type="tel" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
    </div>

    <button id="btnJoinRoom" class="btn btn-ghost" style="padding:14px; border-radius:14px; font-size:15px; color:#E9D5FF;">
      🔗 الانضمام لغرفة
    </button>
  </div>
</div>

<!-- ═══════════ LOBBY ═══════════ -->
<div id="screen-lobby" class="screen">
  <div class="lobby-wrap">
    <div class="room-code-box">
      <div class="room-code-label">كود الغرفة — شاركه مع أصدقائك</div>
      <div class="room-code-value" id="displayRoomCode">----</div>
      <button class="btn btn-ghost" style="margin-top:8px; padding:7px 16px; border-radius:12px; font-size:11px; color:#C4B5FD;" id="btnCopyCode">
        📋 نسخ الكود
      </button>
    </div>

    <div>
      <div class="section-title" style="margin-bottom:6px;">
        اللاعبون <span id="playersCountBadge" style="color:var(--violet-light); font-size:11px;">0/4</span>
      </div>
      <div id="playersGrid" class="players-grid"></div>
    </div>

    <div id="hostControls" class="flex-col gap-8">
      <div class="section-title" style="margin-bottom:2px;">اختر القسم</div>
      <div class="cat-grid">
        <button class="cat-btn" type="button" data-category="football">
          <span class="cat-icon">⚽</span><span class="cat-name">كرة القدم</span>
        </button>
        <button class="cat-btn" type="button" data-category="general">
          <span class="cat-icon">🧠</span><span class="cat-name">معلومات عامة</span>
        </button>
        <button class="cat-btn" type="button" data-category="anime">
          <span class="cat-icon">🎌</span><span class="cat-name">أنمي</span>
        </button>
        <button class="cat-btn" type="button" data-category="islamic">
          <span class="cat-icon">🕌</span><span class="cat-name">إسلاميات</span>
        </button>
      </div>
    </div>

    <div id="guestWait" class="guest-status-card hidden">
      <div class="guest-status-label">القسم المُختار</div>
      <div class="guest-status-cat" id="guestCategoryDisplay">
        <span class="cat-icon">❓</span>
        <span class="cat-name-text">في انتظار اختيار المضيف</span>
      </div>
      <div class="guest-status-msg" id="guestWaitMsg">
        في انتظار المضيف ليبدأ المباراة<span class="dot"></span>
      </div>
    </div>

    <div class="spacer"></div>

    <button id="btnStartGame" class="btn btn-primary hidden" style="padding:14px; border-radius:14px; font-size:15px;">
      🎬 ابدأ اللعبة
    </button>
  </div>
</div>

<!-- ═══════════ GAME ═══════════ -->
<div id="screen-game" class="screen">
  <div class="game-wrap">
    <div class="game-top">
      <div class="q-pill" id="qCounter">سؤال 1</div>
      <div class="target-pill">🎯 الهدف <span id="targetScoreDisplay">10</span></div>
    </div>

    <div id="questionCard" class="question-card card">جاري تحميل السؤال...</div>

    <div id="choicesGrid" class="choices-grid">
      <button class="choice-btn" data-idx="0"><span class="choice-letter">أ</span><span class="choice-text"></span></button>
      <button class="choice-btn" data-idx="1"><span class="choice-letter">ب</span><span class="choice-text"></span></button>
      <button class="choice-btn" data-idx="2"><span class="choice-letter">ج</span><span class="choice-text"></span></button>
      <button class="choice-btn" data-idx="3"><span class="choice-letter">د</span><span class="choice-text"></span></button>
    </div>

    <div class="live-scores" id="liveScores"></div>
  </div>
</div>

<!-- ═══════════ RESULTS ═══════════ -->
<div id="screen-results" class="screen">
  <div class="results-wrap">
    <div class="trophy">🏆</div>
    <div class="results-title title-gradient">النتائج النهائية</div>
    <div class="winner-name" id="winnerNameDisplay"></div>
    <div id="gameOverReason" style="color:var(--muted); font-size:12px; line-height:1.5; text-align:center;"></div>
    <div id="resultsList" class="results-list"></div>
    <button id="btnPlayAgain" class="btn btn-primary hidden" style="padding:14px; border-radius:14px; font-size:15px; width:100%;">
      🔄 لعبة جديدة
    </button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// قائمة الأقسام
// ═══════════════════════════════════════════════════
const ALLOWED_CATEGORIES = new Set(['football', 'general', 'anime', 'islamic']);
function safeCategory(raw) {
  if (raw == null) return null;
  const t = String(raw).trim().toLowerCase();
  if (ALLOWED_CATEGORIES.has(t)) return t;
  return null;
}

const CATEGORY_META = {
  football: { icon: '⚽', name: 'كرة القدم' },
  general:  { icon: '🧠', name: 'معلومات عامة' },
  anime:    { icon: '🎌', name: 'أنمي' },
  islamic:  { icon: '🕌', name: 'إسلاميات' }
};

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const state = {
  myName: '', myAvatar: '🎮', roomCode: '', isHost: false,
  players: [], category: null, mySocketId: null,
  myLocked: false,               // هل أنا مجمّد هذا السؤال؟
  myWrongChoice: -1,             // فهرس الخيار الذي أخطأت فيه
  targetScore: 10,
  removedChoices: new Set()
};

const $ = id => document.getElementById(id);
const socket = io();

// ═══════════════════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + name).classList.add('active');
}

// ═══════════════════════════════════════════════════
// CREATE / JOIN
// ═══════════════════════════════════════════════════
$('btnCreateRoom').addEventListener('click', () => {
  const name = $('inputName').value.trim();
  if (!name) return;   // بدون رسالة
  state.myName = name;
  socket.emit('create_room', { name, avatar: state.myAvatar });
});

$('btnJoinRoom').addEventListener('click', () => {
  const name = $('inputName').value.trim();
  const code = $('inputRoomCode').value.trim();
  if (!name || !/^\d{4}$/.test(code)) return;   // بدون رسالة
  state.myName = name;
  socket.emit('join_room', { code, name, avatar: state.myAvatar });
});

// ═══════════════════════════════════════════════════
// SOCKET
// ═══════════════════════════════════════════════════
socket.on('connect', () => { state.mySocketId = socket.id; });

socket.on('room_created', ({ code }) => {
  state.roomCode = code; state.isHost = true;
  $('displayRoomCode').textContent = code;
  showScreen('lobby');
});

socket.on('room_joined', ({ code }) => {
  state.roomCode = code; state.isHost = false;
  $('displayRoomCode').textContent = code;
  showScreen('lobby');
});

socket.on('error_msg', ({ msg }) => {
  // ⚠️ لا نعرض أي رسالة — فقط نطبع في الـ console
  console.warn('⚠️', msg);
});

socket.on('host_changed', ({ name }) => {
  state.isHost = false;
  console.log(`👑 المضيف الجديد: ${name}`);
});

socket.on('player_left', ({ name }) => {
  console.log(`🚪 غادر: ${name}`);
});

// ═══════════════════════════════════════════════════
// ROOM UPDATE
// ═══════════════════════════════════════════════════
socket.on('room_update', (data) => {
  state.players = data.players;
  state.category = data.category;
  state.isHost = (data.hostId === state.mySocketId);
  state.targetScore = data.targetScore || 10;
  $('targetScoreDisplay').textContent = state.targetScore;

  if (data.state === 'playing' || data.state === 'reveal') {
    renderLiveScores(data.players);
  }
  if (data.state === 'lobby' || data.state === 'category') {
    renderLobby(data);
  }
});

function renderLobby(data) {
  $('displayRoomCode').textContent = data.code;
  $('playersCountBadge').textContent = `${data.players.length}/4`;

  const grid = $('playersGrid');
  grid.innerHTML = '';
  const hostIndex = data.players.findIndex(x => x.socketId === data.hostId);

  for (let i = 0; i < 4; i++) {
    const p = data.players[i];
    const slot = document.createElement('div');
    slot.className = 'player-slot';
    if (p) {
      slot.classList.add('filled');
      if (i === hostIndex) slot.classList.add('is-host');
      slot.innerHTML = `
        <div class="ps-avatar">${escapeHtml(p.avatar || '🎮')}</div>
        <div class="ps-name">${escapeHtml(p.name)}${p.name === state.myName ? ' (أنت)' : ''}</div>
        ${i === hostIndex ? '<div class="ps-badge">المضيف</div>' : ''}
      `;
    } else {
      slot.innerHTML = `<div class="ps-empty">في انتظار لاعب...</div>`;
    }
    grid.appendChild(slot);
  }

  if (state.isHost) {
    $('hostControls').classList.remove('hidden');
    $('guestWait').classList.add('hidden');
    const startBtn = $('btnStartGame');
    const canStart = (data.players.length >= 2) && !!data.category;
    startBtn.classList.toggle('hidden', !data.category);
    startBtn.disabled = !canStart;
    if (!data.category) {
      startBtn.classList.add('hidden');
    } else if (data.players.length < 2) {
      startBtn.textContent = '⏳ في انتظار لاعبين';
      startBtn.disabled = true;
    } else {
      startBtn.textContent = '🎬 ابدأ اللعبة';
      startBtn.disabled = false;
    }
    document.querySelectorAll('.cat-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.category === data.category);
      b.disabled = false;
    });
  } else {
    $('hostControls').classList.add('hidden');
    $('guestWait').classList.remove('hidden');
    $('btnStartGame').classList.add('hidden');
    const ic = $('guestCategoryDisplay').querySelector('.cat-icon');
    const nm = $('guestCategoryDisplay').querySelector('.cat-name-text');
    if (data.category && CATEGORY_META[data.category]) {
      const m = CATEGORY_META[data.category];
      ic.textContent = m.icon; nm.textContent = m.name;
      $('guestWaitMsg').innerHTML = 'في انتظار المضيف ليبدأ المباراة<span class="dot"></span>';
    } else {
      ic.textContent = '❓'; nm.textContent = 'في انتظار اختيار المضيف';
      $('guestWaitMsg').innerHTML = 'في انتظار المضيف ليختار القسم<span class="dot"></span>';
    }
  }
}

// ═══════════════════════════════════════════════════
// HOST: category selection
// ═══════════════════════════════════════════════════
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!state.isHost) return;
    const cat = safeCategory(btn.dataset.category);
    if (!cat) return;
    socket.emit('select_category', { category: cat });
  });
});

$('btnStartGame').addEventListener('click', () => socket.emit('start_game'));
$('btnCopyCode').addEventListener('click', () => {
  if (!state.roomCode) return;
  navigator.clipboard.writeText(state.roomCode).catch(() => {});
});

// ═══════════════════════════════════════════════════
// GAME START
// ═══════════════════════════════════════════════════
socket.on('game_started', ({ targetScore }) => {
  state.targetScore = targetScore || 10;
  state.myLocked = false;
  state.myWrongChoice = -1;
  $('targetScoreDisplay').textContent = state.targetScore;
  showScreen('game');
  $('qCounter').textContent = 'سؤال 1';
});

// ═══════════════════════════════════════════════════
// NEW QUESTION — انتقال نظيف، بدون رسائل
// ═══════════════════════════════════════════════════
socket.on('new_question', ({ index, question, choices, targetScore, players }) => {
  state.removedChoices = new Set();
  state.myLocked = false;
  state.myWrongChoice = -1;
  if (targetScore) state.targetScore = targetScore;

  $('qCounter').textContent = `سؤال ${index + 1}`;
  $('questionCard').textContent = question;
  $('targetScoreDisplay').textContent = state.targetScore;

  if (players) {
    state.players = players.map(p => ({ ...p, locked: false }));
  }

  // بناء الخيارات من جديد — نظيفة تماماً
  const grid = $('choicesGrid');
  grid.innerHTML = '';
  const letters = ['أ', 'ب', 'ج', 'د'];
  choices.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.dataset.idx = i;
    btn.innerHTML = `<span class="choice-letter">${letters[i]}</span><span class="choice-text">${escapeHtml(ch)}</span>`;
    btn.addEventListener('click', () => submitAnswer(i));
    grid.appendChild(btn);
  });

  renderLiveScores(state.players);
});

// ═══════════════════════════════════════════════════
// SUBMIT ANSWER
// ═══════════════════════════════════════════════════
function submitAnswer(choiceIndex) {
  if (state.myLocked) return;

  // تعطيل كل الأزرار مؤقتاً لمنع الإرسال المتعدد
  document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; });
  socket.emit('submit_answer', { choiceIndex });
}

// ═══════════════════════════════════════════════════
// ✅ إجابة صحيحة
// ═══════════════════════════════════════════════════
socket.on('answer_correct', ({ correctIndex, scores }) => {
  // إبراز الخيار الصحيح
  document.querySelectorAll('.choice-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === correctIndex) b.classList.add('correct');
  });

  if (scores) {
    state.players = scores.map(s => ({
      ...s,
      locked: state.players.find(p => p.name === s.name)?.locked || false
    }));
    renderLiveScores(state.players);
  }
  // الانتقال للسؤال التالي يحدث تلقائياً من السيرفر
});

// ═══════════════════════════════════════════════════
// ❌ إجابة خاطئة — تصميم "التجميد" الجديد (بدون Overlay)
// ═══════════════════════════════════════════════════
socket.on('answer_wrong', ({ playerSocketId, choiceIndex, removedChoices, lockedPlayers, scores }) => {
  state.removedChoices = new Set(removedChoices || []);

  if (scores) {
    state.players = scores.map(s => ({
      ...s,
      locked: (lockedPlayers || []).includes(s.name)
    }));
  }

  const iAmTheWrongPlayer = (playerSocketId === state.mySocketId);

  if (iAmTheWrongPlayer) {
    // أنا المُخطئ — تجميد بصري نظيف:
    // 1) خياري الخاطئ → أحمر
    // 2) باقي الأزرار → opacity 0.5 + pointer-events: none (بدون تغيير لون)
    // 3) بدون أي overlay أو رسالة
    state.myLocked = true;
    state.myWrongChoice = choiceIndex;

    document.querySelectorAll('.choice-btn').forEach((b, i) => {
      b.disabled = true;
      if (i === choiceIndex) {
        b.classList.add('wrong');
      } else if (!b.classList.contains('correct') && !b.classList.contains('removed')) {
        b.classList.add('dimmed');
      }
    });
  } else {
    // لست أنا — أُبرز فقط الخيار المختار خطأً من اللاعب الآخر
    document.querySelectorAll('.choice-btn').forEach((b, i) => {
      if ((removedChoices || []).includes(i)) {
        b.classList.add('removed');
        b.disabled = true;
      } else if (!state.myLocked && !b.classList.contains('correct') && !b.classList.contains('wrong')) {
        // أبقيه مفعّلاً إذا لم أكن مجمداً
        b.disabled = false;
      }
    });
  }

  renderLiveScores(state.players);
});

// ═══════════════════════════════════════════════════
// كشف الإجابة (عند تجميد الجميع)
// ═══════════════════════════════════════════════════
socket.on('round_revealed', ({ correctIndex }) => {
  document.querySelectorAll('.choice-btn').forEach((b, i) => {
    b.disabled = true;
    b.classList.remove('dimmed');
    if (i === correctIndex) b.classList.add('correct');
  });
});

// ═══════════════════════════════════════════════════
// LIVE SCORES
// ═══════════════════════════════════════════════════
function renderLiveScores(players) {
  const container = $('liveScores');
  container.innerHTML = '';
  const list = players && players.length ? players : state.players;
  const sorted = [...list].sort((a, b) => (b.score || 0) - (a.score || 0));
  sorted.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'score-chip';
    if (p.name === state.myName) chip.classList.add('me');
    if (p.locked) chip.classList.add('locked');
    const lockIcon = p.locked ? '🧊' : '';
    chip.innerHTML = `
      <span class="sc-avatar">${escapeHtml(p.avatar || '🎮')}</span>
      <span>${escapeHtml(p.name)}</span>
      <span class="sc-score">${p.score || 0}</span>
      ${lockIcon ? `<span class="sc-state">${lockIcon}</span>` : ''}
    `;
    container.appendChild(chip);
  });
}

// ═══════════════════════════════════════════════════
// GAME OVER
// ═══════════════════════════════════════════════════
socket.on('game_over', ({ winnerName, reason, rankings }) => {
  showScreen('results');
  $('winnerNameDisplay').textContent = winnerName ? `🏅 ${winnerName}` : '';
  $('gameOverReason').textContent = reason || '';

  const list = $('resultsList');
  list.innerHTML = '';
  const medals = ['🥇', '🥈', '🥉', '4️⃣'];

  rankings.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = `result-row rank-${p.rank}`;
    row.innerHTML = `
      <div class="result-info">
        <span class="result-rank">${medals[i] || '#' + p.rank}</span>
        <span class="result-avatar">${escapeHtml(p.avatar || '🎮')}</span>
        <span class="result-name">${escapeHtml(p.name)}</span>
      </div>
      <span class="result-score">${p.score}</span>
    `;
    list.appendChild(row);
  });

  $('btnPlayAgain').classList.toggle('hidden', !state.isHost);
});

$('btnPlayAgain').addEventListener('click', () => socket.emit('play_again'));

socket.on('room_reset', () => {
  state.myLocked = false;
  state.myWrongChoice = -1;
  state.category = null;
  state.removedChoices = new Set();
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  showScreen('lobby');
});

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
